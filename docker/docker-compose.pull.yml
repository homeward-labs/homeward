# 镜像版部署（从 GHCR 拉取预构建多架构镜像，设备上无需源码、无需本地构建）
#
# 适用：已发布版本。升级只需两行，设备上零源码文件，基础层缓存不重下：
#   docker compose -f docker/docker-compose.pull.yml pull
#   docker compose -f docker/docker-compose.pull.yml up -d
#
# 想锁定某版本可覆盖标签：HOMEWARD_IMAGE_TAG=v0.1.0 docker compose -f ... up -d
#   （默认 :latest，即最新发布版）。
#
# 网络模式：默认 bridge + ports 映射（NAS / 通用 Linux）。软路由（iStoreOS / OpenWrt）
#   建议 host 模式 —— bridge 下容器看不到宿主 ARP 表，设备 MAC / OUI 厂商识别会落空：
#   HOMEWARD_NETWORK_MODE=host docker compose -f docker/docker-compose.pull.yml up -d
#   （host 模式下 ports 映射被 Docker 忽略，端口由进程直接监听宿主，无需关心）
#
# 软路由/NAS 部署建议同时声明宿主自身 IP（F6 本机身份，防宿主自身流量被误判外传）：
#   HOMEWARD_SELF_IPS=192.168.1.254 docker compose -f ... up -d
#
# 数据挂载沿用 HOMEWARD_DATA_HOST / HOMEWARD_LOGS_HOST 环境变量（安装脚本注入），
# 与 docker-compose.istoreos.yml 行为一致 —— 升级不丢数据。
#
# iStoreOS 前置：开启系统 dnsmasq 日志到 /tmp/dnsmasq.log（见 istoreos 版注释）。

services:
  homeward:
    image: ghcr.io/homeward-labs/homeward:${HOMEWARD_IMAGE_TAG:-latest}
    container_name: homeward
    restart: unless-stopped

    # 默认 bridge（通用平台）。软路由设备用 host 模式见文件头注释（ARP 真实 MAC）。
    # host 模式下 Docker 会忽略 ports 映射（仅打告警），不影响使用。
    network_mode: ${HOMEWARD_NETWORK_MODE:-bridge}

    deploy:
      resources:
        limits:
          cpus: "0.50"
          # 192M：OUI 厂商表改为全量（4 万条）后常驻内存约 +12MB，原 128M 余量偏紧
          memory: 192M
          pids: 128
        reservations:
          cpus: "0.10"
          memory: 32M

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; s=urllib.request.urlopen('http://127.0.0.1:9595/api/health').status; sys.exit(0 if s==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    volumes:
      # 持久化数据目录：安装脚本用 HOMEWARD_DATA_HOST 覆盖为宿主机持久路径，
      # 避免重装/重启丢数据（与 istoreos 版一致）。
      - ${HOMEWARD_DATA_HOST:-./data}:/app/data
      - ${HOMEWARD_LOGS_HOST:-./logs}:/app/logs
      # iStoreOS / OpenWrt 系统 dnsmasq 日志（只读）。
      - /tmp/dnsmasq.log:/tmp/dnsmasq.log:ro
    environment:
      - HOST=0.0.0.0
      - PORT=9595
      - LOG_LEVEL=info
      - PYTHONDONTWRITEBYTECODE=1
      - KNOWLEDGE_BASE_AUTO_UPDATE=false
      - KNOWLEDGE_BASE_UPDATE_INTERVAL=604800
      - HOMEWARD_AUTH_TOKEN=${HOMEWARD_AUTH_TOKEN:-}
      # 显式指向 iStoreOS 的日志落点
      - DNS_LOG_PATH=/tmp/dnsmasq.log
      # 本机身份（F6）：宿主自身 LAN IP。宿主设备归并「本机」+ 自身系统流量不误判外传。
      - HOMEWARD_SELF_IPS=${HOMEWARD_SELF_IPS:-}
      # 许可令牌 / 设备标识落盘目录（随 /app/data 卷持久化，容器重建不丢指纹）
      - HOMEWARD_DATA_DIR=/app/data/homeward
      # 正式 Ed25519 公钥（LIC-06 §4.3）。默认留空让镜像用内嵌值；
      # 部署方在 .env 里显式注入 prod key（或构建时注入），并同时设 REQUIRE_PROD_KEY=1。
      - HOMEWARD_LICENSE_PUBLIC_KEY_B64=${HOMEWARD_LICENSE_PUBLIC_KEY_B64:-}
      # 运行门禁：设为 1 则 verify.py 的 assert_production_key 强制 prod key，
      # dev key 启动直接 RuntimeError（挡住误发版）。默认空 = 只告警不阻断。
      - HOMEWARD_REQUIRE_PROD_KEY=${HOMEWARD_REQUIRE_PROD_KEY:-}
    ports:
      - "9595:9595"
    command: ["python", "-m", "src.ui.server"]
