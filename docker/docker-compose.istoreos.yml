# iStoreOS / OpenWrt 专属单容器形态 —— 一条命令挂系统 dnsmasq 日志（不自带 dnsmasq）
#
# 为什么是单容器：iStoreOS 本身就是路由器，系统 dnsmasq 已占着 53 端口在跑。
#   家卫只需要**只读挂载 iStoreOS 那个 dnsmasq 的日志**即可，再起一个 dnsmasq 容器会抢 53 端口冲突。
#   本 compose 只起家卫一个容器，挂载 iStoreOS 的 /tmp/dnsmasq.log（OpenWrt 默认 log-facility 落点）。
#
# 用法（一条命令）：
#   docker compose -f docker/docker-compose.istoreos.yml up -d
#   # 浏览器开 http://<iStoreOS IP>:9595
#
# 前置（一次性，在 iStoreOS 上开启 dnsmasq 日志到文件；或直接用仓库 scripts/setup-istoreos.sh 一键完成）：
#   方式 A（图形）：iStoreOS 管理页 → 网络 → DHCP/DNS → 「日志」标签页（不在「常规」里）→
#     勾选「记录 DNS 查询」；在「日志设施」下拉框选 /tmp/dnsmasq.log
#     （第一次列表里没有：在下拉框最下面的输入框输入 /tmp/dnsmasq.log 并回车添加）→ 保存应用
#   方式 B（命令行）：在 iStoreOS 终端执行
#     uci set dhcp.@dnsmasq[0].logqueries='1'
#     uci set dhcp.@dnsmasq[0].logfacility='/tmp/dnsmasq.log'
#     uci commit dhcp && /etc/init.d/dnsmasq restart
#   确认产生日志：logread -e dnsmasq 或 cat /tmp/dnsmasq.log 能看到 query[...] 行即可。
#   若你的 iStoreOS 把日志写到了别处，把下面 volumes 的源路径和 DNS_LOG_PATH 一起改成实际位置。

services:
  homeward:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: homeward
    restart: unless-stopped

    # host 网络（2026-10-11 真机实测定稿）：bridge 模式下容器有自己的网络栈，
    # 看不到宿主 ARP 表 → 设备 MAC / OUI 厂商识别全部落空；host 模式直接共享
    # 宿主网络栈，ARP 可见真实 MAC（见私有 CHANGELOG 第 64 批）。
    # 端口由进程直接监听宿主 9595（HOST=0.0.0.0），无需 ports 映射。
    network_mode: host

    deploy:
      resources:
        limits:
          cpus: "0.50"
          # 192M：OUI 厂商表改为全量（4 万条）后常驻内存约 +12MB，
          # 原 128M 下实测已用到 50%，留给观测缓存的余量偏紧，故上调。
          memory: 192M
          pids: 128
        reservations:
          cpus: "0.10"
          memory: 32M

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; s=urllib.request.urlopen('http://127.0.0.1:9595/api/health').status; sys.exit(0 if s==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    volumes:
      # 持久化数据目录：默认 ./data（相对 compose 文件）；安装脚本会用 HOMEWARD_DATA_HOST
      # 覆盖为宿主机上的持久路径（如 /userdata/homeward/homeward-data），避免重装/重启丢数据。
      - ${HOMEWARD_DATA_HOST:-./data}:/app/data
      - ${HOMEWARD_LOGS_HOST:-./logs}:/app/logs
      # iStoreOS / OpenWrt 系统 dnsmasq 日志（只读）。默认 /tmp/dnsmasq.log；
      # 若你改过 logfacility，把这里的源路径一并改掉。
      - /tmp/dnsmasq.log:/tmp/dnsmasq.log:ro
      # iStoreOS / OpenWrt dnsmasq DHCP 租约（只读）：设备发现「MAC + IP + 主机名」
      # 三件套的主要来源（DEFAULT_LEASES_PATHS 的第一个路径）。
      # 不挂它，容器里只剩 ARP 一条路 —— 没主动通信过的设备永远停在「裸 IP」，
      # 厂商 / 品类识别全部落空。租约写在别处的话，改这里的源路径即可
      # （文件不存在时 Docker 会建一个空目录占位，代码按读失败静默跳过，无害）。
      - /tmp/dhcp.leases:/tmp/dhcp.leases:ro
    environment:
      - HOST=0.0.0.0
      - PORT=9595
      - LOG_LEVEL=info
      - PYTHONDONTWRITEBYTECODE=1
      - KNOWLEDGE_BASE_AUTO_UPDATE=false
      - KNOWLEDGE_BASE_UPDATE_INTERVAL=604800
      - HOMEWARD_AUTH_TOKEN=${HOMEWARD_AUTH_TOKEN:-}
      # 显式指向 iStoreOS 的日志落点（也可靠代码自动探测，这里写死最稳）
      - DNS_LOG_PATH=/tmp/dnsmasq.log
      # 本机身份（F6）：宿主自身 LAN IP，逗号分隔可多个。填了之后——
      #   ① 宿主设备归并进「本机」，不再单列一台；
      #   ② 路由器/NAS 自身的系统更新流量不再被误判为「突发大流量外传」。
      # 不填则尽力用主机名自动判定（host 模式下通常也能解析到，显式最稳）。
      - HOMEWARD_SELF_IPS=${HOMEWARD_SELF_IPS:-}
      # 许可令牌 / 设备标识落盘目录（随 ./data 卷持久化，容器重建不丢指纹）
      - HOMEWARD_DATA_DIR=/app/data/homeward
      - HOMEWARD_LICENSE_PUBLIC_KEY_B64=${HOMEWARD_LICENSE_PUBLIC_KEY_B64:-}
    command: ["python", "-m", "src.ui.server"]
