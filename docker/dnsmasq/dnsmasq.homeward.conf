# 家卫双容器形态用的 dnsmasq 配置
# 适用场景：宿主机本身没有 dnsmasq（裸 Linux 主机 / 云主机 / 某些 NAS）。
#          在这台机器上由 dnsmasq 容器充当局域网的 DNS 解析点，家卫只读它的查询日志。
# 注意：iStoreOS / OpenWrt / 飞牛 等已有系统 dnsmasq 的环境请不要使用本配置，
#       直接挂系统日志即可（见 docker-compose.istoreos.yml / docker-compose.yaml）。

# 只监听容器内的所有接口；53 端口通过 compose 的 ports 映射暴露给宿主机。
bind-interfaces
listen-address=0.0.0.0
port=53

# 上游真实解析（保证上网正常）。按你的运营商/偏好改。
server=223.5.5.5
server=119.29.29.29

cache-size=1000

# 每条查询都记，含客户端 IP —— 这是家卫识别「哪台设备问了谁」的唯一数据源。
log-queries=extra
log-facility=/var/log/dnsmasq.log
