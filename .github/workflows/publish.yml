name: publish

# 多架构镜像发布到 GHCR（ghcr.io/homeward-labs/homeward）。
#
# 为什么必须多架构：家卫的目标设备是软路由与 NAS —— x86 小主机是 amd64，
# 大量 ARM 开发板与 ARM NAS 是 arm64，部分老 NAS 是 armv7。只发 amd64 镜像，
# 等于把一大半目标设备挡在门外（只能本地 build，对普通用户等于不可用）。
#
# 触发：
#   1) push 到 main —— 只打 :latest（跟进开发主线，真机/用户随时拉到最新）；
#   2) 打 v* tag   —— 打 :latest + 语义化版本号（正式发布）；
#   3) 手动 workflow_dispatch。
# ⚠️ 教训（2026-10-12 真机测试）：原先只在 v* tag 触发，push main 后 GHCR :latest
#   停在旧版，真机拉「latest」拉到的一直是旧 UI —— 排查半天才发现是触发条件问题。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # GitHub Actions permissions 只支持 read|write|none，没有 admin

jobs:
  image:
    name: 构建并推送多架构镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 QEMU（跨架构构建）
        uses: docker/setup-qemu-action@v3

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推导镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=true

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ── 发布门禁 ──
          # 仓库内嵌的是**开发公钥**，开发私钥存在于本地联调环境：任何人拿到它
          # 都能签出「验签通过」的许可令牌，付费升级形同虚设。
          # 因此对外发布的镜像必须注入正式公钥（对应维护者私有目录下的签发私钥）。
          # 未配置该 secret 时这里传空值 → 镜像仍停留在开发公钥状态，
          # 服务启动会打印告警；发布前请务必在仓库 Settings → Secrets 配好。
          build-args: |
            HOMEWARD_LICENSE_PUBLIC_KEY_B64=${{ secrets.HOMEWARD_LICENSE_PUBLIC_KEY_B64 }}

      - name: 诊断 GHCR 包 visibility（列出所有尝试 + 完整响应）
        # 诊断增强（2026-10-28）：组织 homeward-labs 的 homeward 包 visibility 始终为 private，
        #   手动改也保存不了。本步骤用 GHCR_PAT 试多种 endpoint，列出完整响应体来定位根因。
        #   所有尝试都只是诊断，不染红 job。
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== 1. GET 当前包状态 ==="
          curl -sS -H "Authorization: Bearer ${GHCR_TOKEN}" \
            "https://api.github.com/orgs/homeward-labs/packages/container/homeward" | python3 -m json.tool || true
          echo ""
          echo "=== 2. PUT /orgs/.../visibility（带 X-GitHub-Api-Version） ==="
          curl -sS -w "\nHTTP %{http_code}\n" -X PUT \
            -H "Authorization: Bearer ${GHCR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/homeward-labs/packages/container/homeward/visibility" \
            -d '{"visibility":"public"}' || true
          echo ""
          echo "=== 3. PATCH /orgs/.../packages/container/homeward ==="
          curl -sS -w "\nHTTP %{http_code}\n" -X PATCH \
            -H "Authorization: Bearer ${GHCR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/homeward-labs/packages/container/homeward" \
            -d '{"visibility":"public"}' || true
          echo ""
          echo "=== 4. GET 包的版本列表（检查 labels/source） ==="
          curl -sS -H "Authorization: Bearer ${GHCR_TOKEN}" \
            "https://api.github.com/orgs/homeward-labs/packages/container/homeward/versions?per_page=1" | python3 -m json.tool || true
          echo ""
          echo "=== 诊断完毕 ==="

  verify:
    name: 校验已发布镜像（amd64）
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GHCR（拉取组织级包需要）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 组织命名空间包匿名 pull 经常 403，用 GHCR_PAT 或 GITHUB_TOKEN 登录。
          # GHCR_PAT 已配（repo + write:packages scope），对组织包有 pull 权限。
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: 拉取并跑一遍冒烟
        run: |
          # TAG 推导：打 tag v1.2.3 → 用 1.2.3；否则（push main / workflow_dispatch）→ 用 latest。
          # 注意 GITHUB_REF_NAME 对 push main 是 "main"，不是 "v*"，不能直接拿来当 tag。
          REF="$GITHUB_REF"
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="latest"
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}"
          echo "验证镜像：$IMAGE"
          docker run -d --name homeward-verify -p 9595:9595 \
            -e HOMEWARD_DATA_DIR=/tmp/homeward "$IMAGE"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9595/api/health > /dev/null && break
            sleep 2
          done
          python3 scripts/smoke.py --base http://127.0.0.1:9595 --write
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: 收尾
        if: always()
        run: |
          docker logs homeward-verify || true
          docker rm -f homeward-verify || true
