name: publish

# 多架构镜像发布到 GHCR（ghcr.io/homeward-labs/homeward）。
#
# 为什么必须多架构：家卫的目标设备是软路由与 NAS —— x86 小主机是 amd64，
# 大量 ARM 开发板与 ARM NAS 是 arm64，部分老 NAS 是 armv7。只发 amd64 镜像，
# 等于把一大半目标设备挡在门外（只能本地 build，对普通用户等于不可用）。
#
# 触发：打 v* tag 发布；也支持手动 workflow_dispatch。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # 推送到 GHCR 必需

jobs:
  image:
    name: 构建并推送多架构镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 QEMU（跨架构构建）
        uses: docker/setup-qemu-action@v3

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推导镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=true

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ── 发布门禁 ──
          # 仓库内嵌的是**开发公钥**，开发私钥存在于本地联调环境：任何人拿到它
          # 都能签出「验签通过」的许可令牌，付费升级形同虚设。
          # 因此对外发布的镜像必须注入正式公钥（对应维护者私有目录下的签发私钥）。
          # 未配置该 secret 时这里传空值 → 镜像仍停留在开发公钥状态，
          # 服务启动会打印告警；发布前请务必在仓库 Settings → Secrets 配好。
          build-args: |
            HOMEWARD_LICENSE_PUBLIC_KEY_B64=${{ secrets.HOMEWARD_LICENSE_PUBLIC_KEY_B64 }}

      - name: 将容器包设为公开（GHCR 默认私有，须显式改公开）
        # 本仓属组织 homeward-labs，包在组织命名空间下，
        # 必须用 /orgs/{org}/packages/... 端点（用 /user/ 会 404 而静默失败）。
        # ⚠️ 已知坑（见第 10 / 59 批）：默认 GITHUB_TOKEN 对「组织容器包」没有改可见性的
        #   admin 权限，PUT 会静默 403/404 → 包保持私有 → 下游 verify job 拉取失败、
        #   整个 publish 标红，但 image 推送其实成功。
        #   根治：在仓库 Settings → Secrets 配一个对 homeward-labs 有「包管理员」角色的
        #   PAT（名为 GHCR_PAT）；本步优先用它，失败再回退 GITHUB_TOKEN。
        #   无论哪个 token，失败都显式 exit 1 让 job 变红（不再静默吞错）。
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo ">>> 尝试将 ghcr.io/homeward-labs/homeward 设为公开"
          code=$(curl -sS -o /tmp/vis.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${GHCR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/homeward-labs/packages/container/homeward/visibility" \
            -d '{"visibility":"public"}')
          cat /tmp/vis.json; echo
          if [ "${code:0:1}" != "2" ]; then
            echo "::error::将包设为公开失败（HTTP ${code}）。默认 GITHUB_TOKEN 通常对组织包无 admin 权限。"
            echo "  请二选一：(1) 在仓库 Secrets 配 GHCR_PAT（对 homeward-labs 有包管理员角色）；"
            echo "  (2) 到 https://github.com/orgs/homeward-labs/packages/container/homeward/settings 手动改公开。"
            exit 1
          fi
          echo "OK: 已设为公开"

  verify:
    name: 校验已发布镜像（amd64）
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉取并跑一遍冒烟
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}"
          echo "验证镜像：$IMAGE"
          docker run -d --name homeward-verify -p 9595:9595 \
            -e HOMEWARD_DATA_DIR=/tmp/homeward "$IMAGE"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9595/api/health > /dev/null && break
            sleep 2
          done
          python3 scripts/smoke.py --base http://127.0.0.1:9595 --write
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: 收尾
        if: always()
        run: |
          docker logs homeward-verify || true
          docker rm -f homeward-verify || true
