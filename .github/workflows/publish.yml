name: publish

# 多架构镜像发布到 GHCR（ghcr.io/homeward-labs/homeward）。
#
# 为什么必须多架构：家卫的目标设备是软路由与 NAS —— x86 小主机是 amd64，
# 大量 ARM 开发板与 ARM NAS 是 arm64，部分老 NAS 是 armv7。只发 amd64 镜像，
# 等于把一大半目标设备挡在门外（只能本地 build，对普通用户等于不可用）。
#
# 触发：
#   1) push 到 main —— 只打 :latest（跟进开发主线，真机/用户随时拉到最新）；
#   2) 打 v* tag   —— 打 :latest + 语义化版本号（正式发布）；
#   3) 手动 workflow_dispatch。
# ⚠️ 教训（2026-10-12 真机测试）：原先只在 v* tag 触发，push main 后 GHCR :latest
#   停在旧版，真机拉「latest」拉到的一直是旧 UI —— 排查半天才发现是触发条件问题。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # 推送到 GHCR 必需

jobs:
  image:
    name: 构建并推送多架构镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 QEMU（跨架构构建）
        uses: docker/setup-qemu-action@v3

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推导镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=true

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ── 发布门禁 ──
          # 仓库内嵌的是**开发公钥**，开发私钥存在于本地联调环境：任何人拿到它
          # 都能签出「验签通过」的许可令牌，付费升级形同虚设。
          # 因此对外发布的镜像必须注入正式公钥（对应维护者私有目录下的签发私钥）。
          # 未配置该 secret 时这里传空值 → 镜像仍停留在开发公钥状态，
          # 服务启动会打印告警；发布前请务必在仓库 Settings → Secrets 配好。
          build-args: |
            HOMEWARD_LICENSE_PUBLIC_KEY_B64=${{ secrets.HOMEWARD_LICENSE_PUBLIC_KEY_B64 }}

      - name: 将容器包设为公开（公开仓库会自动公开；此步仅作显式加固）
        # 本仓属组织 homeward-labs，包在组织命名空间下，
        # 须用 /orgs/{org}/packages/... 端点（用 /user/ 会 404 而静默失败）。
        # 修正（2026-10-28 · 方案 1）：公开仓库推 GHCR 时，GitHub 会**自动**把容器包可见性
        #   设为公开（公开仓库 → 公开包），因此此步对公开仓库是「冗余加固」而非「必需」。
        #   默认 GITHUB_TOKEN 对组织级包无改可见性的 admin 权限，PUT 通常 403/404 → 失败。
        #   原逻辑用 exit 1 让 job 染红，但这一步在「构建并推送」之后、不影响镜像已推上去，
        #   且公开仓库本就自动公开 → 红是「假红」（还会顺带阻断下方的 verify job）。
        #   现改为：失败仅 ::warning::，不染红 job，让 publish 常绿、verify 也能正常跑。
        #   如需对私有仓库 / 显式控制可见性，在仓库 Secrets 配 GHCR_PAT
        #   （对 homeward-labs 有包管理员角色）即可让此步真正生效。
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo ">>> 尝试将 ghcr.io/homeward-labs/homeward 设为公开（公开仓库通常已自动公开）"
          code=$(curl -sS -o /tmp/vis.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${GHCR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/homeward-labs/packages/container/homeward/visibility" \
            -d '{"visibility":"public"}' || echo "000")
          cat /tmp/vis.json 2>/dev/null; echo
          if [ "${code:0:1}" != "2" ]; then
            echo "::warning::将包设为公开失败（HTTP ${code}）。公开仓库通常已自动公开；如需显式控制可见性，"
            echo "::warning::请在仓库 Secrets 配 GHCR_PAT（对 homeward-labs 有包管理员角色），或到"
            echo "::warning::https://github.com/orgs/homeward-labs/packages/container/homeward/settings 手动确认公开。"
          else
            echo "OK: 已设为公开"
          fi

  verify:
    name: 校验已发布镜像（amd64）
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GHCR（拉取组织级包需要）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 组织命名空间包匿名 pull 经常 403，用 GHCR_PAT 或 GITHUB_TOKEN 登录。
          # GHCR_PAT 已配（repo + write:packages scope），对组织包有 pull 权限。
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: 拉取并跑一遍冒烟
        run: |
          # TAG 推导：打 tag v1.2.3 → 用 1.2.3；否则（push main / workflow_dispatch）→ 用 latest。
          # 注意 GITHUB_REF_NAME 对 push main 是 "main"，不是 "v*"，不能直接拿来当 tag。
          REF="$GITHUB_REF"
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="latest"
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}"
          echo "验证镜像：$IMAGE"
          docker run -d --name homeward-verify -p 9595:9595 \
            -e HOMEWARD_DATA_DIR=/tmp/homeward "$IMAGE"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9595/api/health > /dev/null && break
            sleep 2
          done
          python3 scripts/smoke.py --base http://127.0.0.1:9595 --write
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: 收尾
        if: always()
        run: |
          docker logs homeward-verify || true
          docker rm -f homeward-verify || true
